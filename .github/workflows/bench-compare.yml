name: bench-compare

# 手动触发：共享 runner 上的性能数字不该成为每次 push 的门禁，
# 也不该把测试 CI 拉长。打 tag 前或想看对照数据时手动跑一次即可。
on:
  workflow_dispatch:
    inputs:
      rounds_note:
        description: '备注（仅记录，不改变 workload）'
        required: false
        default: ''

# 平台覆盖与 test.yml 的 runtime 矩阵一致，加上 macOS kqueue。
# 每个 job 在同一台机器上同进程跑 mox_io 与 zio.ev，只比同机比值。
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,        arch: X64,   label: 'Windows x86_64（IOCP）' }
          - { os: windows-11-arm,        arch: ARM64, label: 'Windows arm64（IOCP）' }
          - { os: ubuntu-latest,         arch: X64,   label: 'Linux x86_64（io_uring）' }
          - { os: ubuntu-24.04-arm,      arch: ARM64, label: 'Linux arm64（io_uring）' }
          - { os: macos-latest,          arch: ARM64, label: 'macOS arm64（kqueue）' }
    name: '${{ matrix.label }} — mox_io vs zio.ev'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Zig 0.17.1
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}:${{ matrix.arch }}" in
            Windows:X64)   url="https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip" ;;
            Windows:ARM64) url="https://ziglang.org/download/0.17.1/zig-aarch64-windows-0.17.1.zip" ;;
            Linux:X64)     url="https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz" ;;
            Linux:ARM64)   url="https://ziglang.org/download/0.17.1/zig-aarch64-linux-0.17.1.tar.xz" ;;
            macOS:ARM64)   url="https://ziglang.org/download/0.17.1/zig-aarch64-macos-0.17.1.tar.xz" ;;
            *) echo "::error::没有对应的 Zig 分发包"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/zigdl" && cd "$RUNNER_TEMP/zigdl"
          curl -fsSL -o zigpkg "$url"
          case "$url" in
            *.zip)    unzip -q zigpkg ;;
            *.tar.xz) tar -xJf zigpkg ;;
          esac
          zigdir="$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'zig-*' | head -1)"
          test -n "$zigdir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            zigdir="$(cygpath -w "$zigdir")"
          fi
          echo "$zigdir" >> "$GITHUB_PATH"

      - name: 版本与架构核对
        shell: bash
        run: |
          zig version
          uname -m

      - name: 运行同构性能对照
        id: bench
        shell: bash
        working-directory: bench/compare
        env:
          ROUNDS_NOTE: ${{ github.event.inputs.rounds_note }}
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compare-out.txt"
          # 依赖已钉死到 commit 并带 hash；首次会拉取 oktest / zio。
          zig build compare 2>&1 | tee "$out"
          {
            echo "### $MATRIX_LABEL"
            echo ""
            echo "备注：$ROUNDS_NOTE"
            echo ""
            echo '同一台机器、同一进程、同一 std.Io.Clock.awake；'
            echo "数字含建连/拆连，zio.ev 功能远多于 mox_io，**不代表设计优劣**。"
            echo ""
            # 只把 Markdown 表格与标记说明放进摘要，JSON 留在日志里供解析。
            sed -n '1,/<!-- JSON-BEGIN -->/p' "$out" | sed '$d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/compare-out.txt
          if-no-files-found: warn
