name: test

on:
  # 只在这两条长期分支上跑，避免临时分支/试错提交把 CI 配额烧光。
  push:
    branches: [main, dev]
  # 进 main 的改动一律走 PR，PR 上先跑一遍再合并。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 平台覆盖：Windows / Linux 的 x86_64 与 arm64，加上 macOS。
# 不做 BSD。运行时保证为 Windows IOCP 与 Linux io_uring；
# macOS kqueue 运行时验证留待以后，这里只做原生构建与编译校验。
jobs:
  runtime:
    name: ${{ matrix.os }} ${{ matrix.arch }}（${{ matrix.runtime }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            arch: x86_64
            runtime: IOCP
            runner: windows-latest
            cross: aarch64-windows
          - os: Windows
            arch: arm64
            runtime: IOCP
            runner: windows-11-arm
            cross: x86_64-windows
          - os: Linux
            arch: x86_64
            runtime: io_uring
            runner: ubuntu-latest
            cross: aarch64-linux
          - os: Linux
            arch: arm64
            runtime: io_uring
            runner: ubuntu-24.04-arm
            cross: x86_64-linux
    steps:
      - uses: actions/checkout@v4

      # 不用第三方 setup action：mlugg/setup-zig 已迁往 Codeberg，在 GitHub
      # 上不可用；社区 action 对 arm64 runner 的兼容性也不保证。直接取官方
      # 发布包，按 OS/架构选 URL，六种组合的命名规则是统一的。
      - name: 安装 Zig 0.17.1
        shell: bash
        run: |
          set -euo pipefail
          os="${{ runner.os }}"     # Linux / Windows / macOS
          arch="${{ runner.arch }}" # X64 / ARM64
          case "$os-$arch" in
            Linux-X64)     plat=x86_64-linux;   ext=tar.xz ;;
            Linux-ARM64)   plat=aarch64-linux;  ext=tar.xz ;;
            macOS-X64)     plat=x86_64-macos;   ext=tar.xz ;;
            macOS-ARM64)   plat=aarch64-macos;  ext=tar.xz ;;
            Windows-X64)   plat=x86_64-windows; ext=zip ;;
            Windows-ARM64) plat=aarch64-windows; ext=zip ;;
            *) echo "无对应的 Zig 发布包: $os-$arch"; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.17.1/zig-${plat}-0.17.1.${ext}"
          echo "下载 $url"
          curl -fsSL --retry 3 -o zig-pkg "$url"
          if [ "$ext" = "zip" ]; then
            # tar 解不了 zip（实测），所以 unzip 是唯一路径；缺失就明确报错。
            command -v unzip >/dev/null || { echo "缺少 unzip，无法解压 Windows 版 Zig"; exit 1; }
            unzip -q zig-pkg
          else
            tar -xf zig-pkg
          fi
          # 解压出的目录名就是 zig-<plat>-0.17.1。
          # Windows 上后续步骤默认跑在 pwsh 里，它读不懂 bash 的 MSYS 风格
          # 路径（/d/a/...），必须写 Windows 原生路径，否则 zig 找不到。
          zigdir="$PWD/zig-${plat}-0.17.1"
          if [ "$os" = "Windows" ]; then
            zigdir="$(cygpath -w "$zigdir" 2>/dev/null || echo "$zigdir")"
          fi
          echo "$zigdir" >> "$GITHUB_PATH"
          echo "已加入 PATH: $zigdir"
          "$PWD/zig-${plat}-0.17.1/zig" version

      # 缓存两样东西：本地 .zig-cache（构建产物）与全局缓存（std 编译结果）。
      # 矩阵各格缓存键必须区分平台，否则会互相污染。
      - name: 缓存 Zig 构建产物
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/AppData/Local/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: 版本与架构核对
        run: |
          zig version
          echo "目标后端：${{ matrix.runtime }} / ${{ matrix.arch }}"

      # 托管 runner 可能禁用 io_uring；失败时便于区分代码问题与环境问题。
      - name: 检查 io_uring 可用性
        if: runner.os == 'Linux'
        run: |
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "（无此 sysctl）"
          uname -a

      - name: mox + mox_io 全量测试
        run: zig build test --summary all

      - name: 单独跑 io 模块根测试
        run: zig test src/io/io.zig

      - name: 构建示例
        run: zig build

      - name: 真包依赖验证（外部消费者编译）
        run: zig build test-package

      - name: 三把性能尺子
        run: |
          zig build bench -Drounds=2000 -Doptimize=ReleaseFast
          zig build bench-blocking -Drounds=2000 -Doptimize=ReleaseFast
          zig build bench-concurrent -Dconns=8 -Drounds=1000 -Doptimize=ReleaseFast

      # ARM runner 上顺带验证 x86 目标的交叉编译没被写坏。
      - name: 交叉编译校验（另一架构）
        run: zig test src/io/io.zig -target ${{ matrix.cross }} --test-no-exec

  macos:
    name: macOS arm64（kqueue，运行时待验证）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 同 runtime job：不用已迁走的社区 action，直接取官方发布包。
      - name: 安装 Zig 0.17.1
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.arch }}" in
            ARM64) plat=aarch64-macos ;;
            X64)   plat=x86_64-macos ;;
            *) echo "无对应的 Zig 发布包: ${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.17.1/zig-${plat}-0.17.1.tar.xz"
          echo "下载 $url"
          curl -fsSL --retry 3 -o zig-pkg "$url"
          tar -xf zig-pkg
          echo "$PWD/zig-${plat}-0.17.1" >> "$GITHUB_PATH"
          "$PWD/zig-${plat}-0.17.1/zig" version

      - name: 缓存 Zig 构建产物
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-
      - name: 版本与架构核对
        run: |
          zig version
          uname -m

      # kqueue 后端此前从未在任何机器上运行过，这里首次让它真跑。
      # 若失败，说明发现了真实缺陷而非环境噪音 —— 这正是要买的信息。
      - name: mox + mox_io 全量测试（kqueue 运行时）
        shell: bash
        run: |
          set +e
          secs() { echo "$(($(date +%s) - $1))"; }
          echo "== 编译 io 测试二进制 =="
          t0=$(date +%s)
          zig test src/io/io.zig --test-no-exec -femit-bin=/tmp/io-test
          cbuild=$?
          echo "compile_rc=$cbuild compile_seconds=$(secs "$t0")"
          pass=0
          hang=0
          fail=0
          total=0
          report=/tmp/kqueue-report.txt
          : >"$report"
          names=$(sed -n 's/^test "\(.*\)" {$/\1/p' src/io/tests.zig)
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            total=$((total + 1))
            one=/tmp/kqueue-one.log
            zig test src/io/io.zig --test-filter "$name" >"$one" 2>&1 &
            runner=$!
            ( sleep 20; kill -9 "$runner" 2>/dev/null ) &
            watchdog=$!
            wait "$runner"
            rc=$?
            kill "$watchdog" 2>/dev/null
            wait "$watchdog" 2>/dev/null
            if [ "$rc" -eq 137 ]; then
              echo "HANG $name" >>"$report"
              echo "--- $name (HANG) ---" >>"$report"
              tail -20 "$one" >>"$report"
              hang=$((hang + 1))
            elif [ "$rc" -ne 0 ]; then
              echo "FAIL $name rc=$rc" >>"$report"
              echo "--- $name (rc=$rc) ---" >>"$report"
              tail -20 "$one" >>"$report"
              fail=$((fail + 1))
            else
              pass=$((pass + 1))
            fi
          done <<<"$names"
          echo "== 逐条结果：total=$total pass=$pass fail=$fail hang=$hang =="
          cat "$report"
          {
            echo "### kqueue 逐条结果：total=$total pass=$pass fail=$fail hang=$hang"
            echo '```'
            cat "$report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$cbuild" -ne 0 ] || [ "$hang" -ne 0 ] || [ "$fail" -ne 0 ]; then
            echo "::error::kqueue isolation total=$total pass=$pass fail=$fail hang=$hang"
            while IFS= read -r issue; do
              [ -z "$issue" ] || echo "::error::$issue"
            done <"$report"
            exit 1
          fi
          echo "== mox 模块测试 =="
          zig build test --summary all


      - name: 单独跑 io 模块根测试
        run: zig test src/io/io.zig

      - name: 原生构建示例（kqueue 代码路径编译）
        run: zig build

      - name: 真包依赖验证（外部消费者编译）
        run: zig build test-package

      # 交叉目标编译校验：确认为其它架构生成的代码没被写坏。
      # （本机 kqueue 的运行时行为已由上面的全量测试覆盖，不再需要
      #   「只编译不执行」那一步。）
      - name: 交叉编译校验（x86_64 macOS）
        run: zig test src/io/io.zig -target x86_64-macos --test-no-exec
